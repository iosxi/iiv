; iiv-client の設定(UTF-8)
[client]
; 画質(求めるビットレート): auto(サーバーに任せる。おすすめ)/ lan(多め。LAN 向け)/ wifi(Wi-Fi・遠隔地)/ slow(細い回線)
quality=slow
; 1 = 見るだけ(キー・マウスを送らない)
viewonly=0
; 1 = 全画面で開く
fullscreen=0
; 1 = 窓に合わせて縮める、0 = 等倍
fit=1
; Windows キーや Alt+Tab を相手へ送るとき: fullscreen(全画面のとき)/ always / never
grab=fullscreen
; 1 = タイトルに更新の速さを出す
stats=1
; 描画: gpu(既定。D3D11。縮めても文字がきれい)/ gdi(メモリが少ない。縮めると遅く粗い)
render=gdi
; 1 = つないでいる間はスリープさせず、画面も消さない
nosleep=1

[history]
host=192.168.0.76
host=192.168.0.79

[passwords]
; 「パスワードを覚える」にした接続先(Windows の DPAPI で暗号にしたもの。この PC のこの利用者だけが戻せる)
password.192.168.0.79=dpapi:
password.192.168.0.76=dpapi:

[general]
; system / light / dark
theme=system
; 1 = iiv-client.log に動作の記録を書く
log=0
